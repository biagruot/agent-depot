# Gitleaks configuration — https://github.com/gitleaks/gitleaks
title = "AgentDepot gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known false positives"
# `sk-1234567890abcdef` is a deliberate placeholder inside a blog post that
# teaches readers NOT to commit secrets — it is example text, not a real key.
regexes = ['''sk-1234567890abcdef''']
paths = ['''src/data/blog-posts\.ts''']
